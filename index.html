<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick y Morty</title>
    <link rel="icon" href="https://rickandmortyapi.com/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Buscador de Rick</h1>

    <div id="filters">
       <input type="text" id="name-filters" placeholder="Filtrado por nombre">
        <select name="" id="status-filters">
            <option value="">Filtrar por estado</option>
            <option value="alive">Vivo</option>
            <option value="dead">Muerto</option>
            <option value="unknown">Desconocido</option>
        </select>
    </div>

    <div class="container">
        <div id="characters">
           <!-- Los Personajes --> 
        </div>
        <div id="pagination"></div>
    </div>

    <script src="script.js"></script>

</body>

</html>
